name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build production Worker
        run: pnpm build
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          VARS_JSON: ${{ vars.VARS_JSON }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the production environment."
              exit 1
            fi
          done
          supabase --workdir database link --project-ref "$SUPABASE_PROJECT_REF"
          supabase --workdir database db push --linked --yes

      - name: Apply pending D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: |
          secret_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const bindingName = /^[A-Za-z_][A-Za-z0-9_]*$/;

          function parseObject(raw, name) {
            if (!raw) throw new Error(`Configure ${name} in the production Environment.`);
            let value;
            try {
              value = JSON.parse(raw);
            } catch {
              throw new Error(`${name} must contain a valid JSON object.`);
            }
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              throw new Error(`${name} must contain a valid JSON object.`);
            }
            for (const key of Object.keys(value)) {
              if (!bindingName.test(key)) throw new Error(`${name} contains an invalid binding name: ${key}.`);
            }
            return value;
          }

          const vars = parseObject(process.env.VARS_JSON, 'VARS_JSON');
          const secrets = parseObject(process.env.SECRETS_JSON, 'SECRETS_JSON');

          for (const [key, value] of Object.entries(secrets)) {
            if (typeof value !== 'string') {
              throw new Error(`SECRETS_JSON value for ${key} must be a string.`);
            }
            if (Object.hasOwn(vars, key)) {
              throw new Error(`${key} cannot be present in both VARS_JSON and SECRETS_JSON.`);
            }
          }

          await writeFile(join(process.env.RUNNER_TEMP, 'worker-secrets.json'), JSON.stringify(secrets), {
            mode: 0o600,
          });
          console.log(`Prepared ${Object.keys(secrets).length} Worker secret(s).`);
          NODE

          pnpm exec wrangler deploy --secrets-file "$secret_file"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VARS_JSON: ${{ vars.VARS_JSON }}
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
